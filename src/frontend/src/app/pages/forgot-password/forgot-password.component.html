<main class="page-shell">
  <div class="overlay">
    <section class="auth-card">
      <button class="close-button" type="button" aria-label="Volver" (click)="goBack()">x</button>

      <div class="logo">MA</div>

      <h2>Recuperar Contrase&ntilde;a</h2>
      <p class="subtitle">Ingresa tu correo para recibir un enlace seguro de recuperaci&oacute;n</p>

      <form [formGroup]="forgotForm" (ngSubmit)="submitForgot()">
        <label for="email">Correo electr&oacute;nico</label>
        <div class="input-wrap">
          <span class="input-icon">&#128100;</span>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="tu&#64;ejemplo.com"
            [class.input-error]="forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid"
          >
        </div>
        <div class="error-msg" *ngIf="forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid">
          <span *ngIf="forgotForm.get('email')?.errors?.['required']">El correo es obligatorio.</span>
          <span *ngIf="forgotForm.get('email')?.errors?.['email']">Ingresa un formato de correo v&aacute;lido.</span>
        </div>

        <div class="alert success" *ngIf="successMessage">i {{ successMessage }}</div>
        <div class="alert error" *ngIf="errorMessage">! {{ errorMessage }}</div>

        <button class="primary-button" type="submit" [disabled]="isLoading || forgotForm.invalid">
          <span *ngIf="!isLoading">Enviar Enlace</span>
          <span *ngIf="isLoading" class="spinner"></span>
        </button>

        <button class="link-button back-link" type="button" (click)="goBack()">Volver al Iniciar Sesi&oacute;n</button>
      </form>
    </section>
  </div>
</main>
